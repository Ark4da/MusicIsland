<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'">
  <title>Music Island</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="island is-disconnected is-collapsed is-glass" id="island" data-accent="blue" data-theme="cover">
    <div class="glass" aria-hidden="true">
      <img class="glass__img" alt="" draggable="false">
      <img class="glass__img" alt="" draggable="false">
    </div>

    <section class="now">
      <div class="artwork">
        <img class="artwork__img" alt="" draggable="false">
        <img class="artwork__img" alt="" draggable="false">
      </div>

      <div class="meta">
        <div class="marquee" id="title" data-i18n-title="copyHint"><div class="marquee__track"><span class="marquee__text"></span></div></div>
        <div class="artist" id="artist" data-i18n-title="copyHint"></div>
        <div class="copied" id="copied" data-i18n="copied" aria-live="polite"></div>
      </div>

      <div class="eq" id="eq" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </section>

    <section class="timeline">
      <span class="time" id="elapsed">0:00</span>
      <div class="bar" id="bar">
        <div class="bar__fill" id="barFill"></div>
      </div>
      <span class="time time--right" id="remaining">-0:00</span>
    </section>

    <section class="controls">
      <button class="btn btn--small" id="btnShuffle" data-i18n-title="shuffle">
        <svg class="stroke" viewBox="0 0 24 24"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/></svg>
      </button>
      <button class="btn btn--skip" id="btnPrev" data-i18n-title="prev">
        <svg viewBox="0 0 32 24"><path d="M14.5 4.6v14.8c0 1-1.1 1.6-1.9 1L2.4 13a1.2 1.2 0 0 1 0-2l10.2-7.4c.8-.6 1.9 0 1.9 1Z"/><path d="M29.5 4.6v14.8c0 1-1.1 1.6-1.9 1L17.4 13a1.2 1.2 0 0 1 0-2l10.2-7.4c.8-.6 1.9 0 1.9 1Z"/></svg>
      </button>
      <button class="btn btn--play" id="btnPlay" data-i18n-title="playPause">
        <svg class="icon-play" viewBox="0 0 24 24"><path d="M7 4.2v15.6c0 .9 1 1.5 1.8 1l12.3-7.8a1.2 1.2 0 0 0 0-2L8.8 3.2C8 2.7 7 3.3 7 4.2Z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24"><rect x="5.5" y="3.5" width="4.6" height="17" rx="1.4"/><rect x="13.9" y="3.5" width="4.6" height="17" rx="1.4"/></svg>
      </button>
      <button class="btn btn--skip" id="btnNext" data-i18n-title="next">
        <svg viewBox="0 0 32 24"><path d="M2.5 4.6v14.8c0 1 1.1 1.6 1.9 1L14.6 13a1.2 1.2 0 0 0 0-2L4.4 3.6c-.8-.6-1.9 0-1.9 1Z"/><path d="M17.5 4.6v14.8c0 1 1.1 1.6 1.9 1L29.6 13a1.2 1.2 0 0 0 0-2L19.4 3.6c-.8-.6-1.9 0-1.9 1Z"/></svg>
      </button>
      <button class="btn btn--small" id="btnLike" data-i18n-title="like">
        <svg viewBox="0 0 24 24"><path d="M12 20.6c-.3 0-.6-.1-.8-.3C5.6 15.6 2.5 12.6 2.5 8.9 2.5 6 4.7 3.8 7.5 3.8c1.8 0 3.4.9 4.5 2.4 1.1-1.5 2.7-2.4 4.5-2.4 2.8 0 5 2.2 5 5.1 0 3.7-3.1 6.7-8.7 11.4-.2.2-.5.3-.8.3Z"/></svg>
      </button>
    </section>

    <section class="volume-row" id="volumeRow">
      <button class="vol-btn" id="btnMute" data-i18n-title="mute">
        <svg viewBox="0 0 24 24">
          <path class="vol-speaker" d="M3 9.5v5c0 .55.45 1 1 1h3l4.3 3.6c.65.55 1.7.08 1.7-.77V5.67c0-.85-1.05-1.32-1.7-.77L7 8.5H4c-.55 0-1 .45-1 1Z"/>
          <path class="vol-wave vol-wave--1" d="M16 9.5a3.5 3.5 0 0 1 0 5"/>
          <path class="vol-wave vol-wave--2" d="M18.8 7a7 7 0 0 1 0 10"/>
          <path class="vol-x" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>
        </svg>
      </button>
      <div class="bar bar--volume" id="volBar" data-i18n-title="volume">
        <div class="bar__fill bar__fill--volume" id="volFill"></div>
      </div>
    </section>

    <section class="queue">
      <header class="queue__head">
        <span class="queue__label"><span data-i18n="nextUp"></span><span class="queue__service" id="service"></span></span>
        <button class="queue__refresh" id="btnRefresh" data-i18n-title="refreshQueue">
          <svg class="stroke" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.9 1 6.7 2.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </header>
      <ul class="queue__list" id="queueList"></ul>
      <div class="queue__empty" id="queueEmpty" data-i18n="queueEmpty"></div>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
